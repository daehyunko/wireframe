<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 와이어프레임</title>
  <style>
    :root{font-family:Arial,"맑은 고딕",sans-serif;color:#202632;background:#f6f7f9;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}a{color:#245ac3;text-decoration:none}a:hover{text-decoration:underline}
    main{max-width:1120px;margin:64px auto;padding:0 24px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 10px}header p{margin:0;color:#727b8b;font-size:14px;line-height:1.6}
    .filters{display:flex;gap:8px;margin:28px 0 16px}.filters button{border:1px solid #dce1e9;border-radius:6px;padding:9px 18px;background:white;color:#606b7d;font-size:14px}.filters button[aria-pressed="true"]{background:#243c67;color:white;border-color:#243c67}.filters button:focus-visible,.project-link:focus-visible,a:focus-visible{outline:3px solid #92b8ff;outline-offset:3px}
    .table-wrap{border:1px solid #dfe4ec;border-radius:10px;overflow:hidden;background:#fff}table{border-collapse:collapse;width:100%;table-layout:fixed}th{text-align:left;background:#f0f3f7;padding:15px 22px;font-size:13px;color:#667387;font-weight:600}th:first-child{width:130px}td{padding:22px;border-top:1px solid #e7ebf1;vertical-align:middle}.category{display:inline-block;background:#edf3ff;color:#325fbd;border-radius:5px;padding:5px 10px;font-size:12px;font-weight:bold;white-space:nowrap}
    .project-link{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:0;text-align:left;border:0;background:none;color:#202c40;font-weight:600;font-size:15px;line-height:1.7}.project-link:hover{color:#245ac3}.chevron{font-size:18px;flex:none;color:#7a879a}
    .empty{padding:46px 24px;text-align:center;color:#7b8595;font-size:14px}[hidden]{display:none!important}
    @media(max-width:640px){main{margin:32px auto;padding:0 16px}h1{font-size:23px}th,td{padding:16px 12px}th:first-child{width:88px}.project-link{font-size:14px}.filters button{padding:8px 14px}.category{padding:4px 7px}}
  </style>
</head>
<body>
<main>
  <header><h1>프로젝트 와이어프레임</h1><p>프로젝트를 선택하면 화면 목록을 확인할 수 있습니다.</p></header>
  <nav class="filters" aria-label="프로젝트 구분">
    <button type="button" data-filter="all" aria-pressed="true">전체</button>
    <button type="button" data-filter="global" aria-pressed="false">글로벌</button>
    <button type="button" data-filter="makeshop" aria-pressed="false">메이크샵</button>
  </nav>
  <div class="table-wrap">
    <table aria-label="프로젝트 목록">
      <thead><tr><th scope="col">구분</th><th scope="col">프로젝트명</th></tr></thead>
      <tbody>
        <tr id="project-ms-16904" data-category="global">
          <td><span class="category">글로벌</span></td>
          <td><a class="project-link" href="./ms-16904/index.html" data-local-project="./글로벌/[MS-16904] 배송사·국가별 관부가세 징수·계산 개선/와이어프레임/ms-16904/index.html"><span>[MS-16904] 배송사·국가별 관부가세 징수·계산 개선</span><span class="chevron" aria-hidden="true">›</span></a></td>
        </tr>
        <tr id="empty-projects" hidden><td colspan="2" class="empty">등록된 메이크샵 프로젝트가 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script>
  const projects=[...document.querySelectorAll('[data-category]')];
  const filters=[...document.querySelectorAll('[data-filter]')];
  const empty=document.getElementById('empty-projects');

  filters.forEach(button=>button.addEventListener('click',()=>{
    filters.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    const category=button.dataset.filter;
    projects.forEach(project=>{
      project.hidden=category!=='all'&&project.dataset.category!==category;
    });
    empty.hidden=projects.some(project=>!project.hidden);
    empty.cells[0].textContent=category==='all'
      ? '등록된 프로젝트가 없습니다.'
      : '등록된 '+button.textContent+' 프로젝트가 없습니다.';
  }));

  if(location.protocol==='file:'){
    document.querySelectorAll('[data-local-project]').forEach(link=>{
      link.href=link.dataset.localProject;
    });
  }
</script>
</body>
</html>
